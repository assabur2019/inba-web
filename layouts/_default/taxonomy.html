{{ define "main" }}
<div class="container page-taxonomy">
  <h1>{{ .Title }}</h1>

  {{ if .Content }}
  <div class="taxonomy-content">
    {{ .Content }}
  </div>
  {{ end }}

  <ul class="taxonomy-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
