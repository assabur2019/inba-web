{{ define "main" }}
<div class="container page-terms">
  <h1>{{ .Title }}</h1>

  {{ if .Content }}
  <div class="terms-content">
    {{ .Content }}
  </div>
  {{ end }}

  <ul class="taxonomy-list">
    {{ range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
      <span>({{ .Count }})</span>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
