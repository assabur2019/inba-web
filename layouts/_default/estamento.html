{{ define "main" }}
<section class="qs-hero">
  {{ if .Params.hero_image }}<img class="qs-hero-image" src="{{ .Params.hero_image | relURL }}" alt="{{ .Title }}">{{ end }}
  <div class="qs-hero-shade"></div>
  <div class="wrap qs-hero-content">
    <p class="home-eyebrow">Estamentos INBA</p>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<article class="wrap article-single qs-body">
  <div class="article-body">
    {{ .Content }}
  </div>
</article>

{{ if .Params.team }}
<section class="au-grid wrap">
  {{ range .Params.team }}
  <article class="au-card">
    <span class="au-avatar"></span>
    <h3>{{ .name }}</h3>
    <p class="au-role">{{ .role }}</p>
    <a class="au-email" href="mailto:{{ .email }}">{{ .email }}</a>
  </article>
  {{ end }}
</section>
{{ end }}
{{ end }}
