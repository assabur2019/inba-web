{{ define "main" }}
<article class="wrap article-single">
  <p class="meta"><a href="{{ "/comunicados/" | relURL }}">&larr; Comunicados</a> · {{ .Date | time.Format ":date_long" }}</p>
  <h1>{{ .Title }}</h1>
  {{ if .Params.image }}
  <img class="article-hero" src="{{ .Params.image | relURL }}" alt="{{ .Title }}">
  {{ end }}
  <div class="article-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
