{{ define "main" }}
<section class="wrap">
  <h1>Comunicados</h1>
  <div class="news-grid">
    {{ range .Pages.ByDate.Reverse }}
    <article class="news-card">
      {{ if .Params.image }}<a href="{{ .RelPermalink }}"><img src="{{ .Params.image | relURL }}" alt="{{ .Title }}"></a>{{ end }}
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p class="meta">{{ .Date | time.Format ":date_long" }}</p>
      <p>{{ .Params.excerpt | default .Summary }}</p>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
