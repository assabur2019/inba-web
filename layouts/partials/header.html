<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "images/logo-inba.png" | relURL }}" alt="Internado Nacional Barros Arana" class="brand-logo-wide">
      <span class="brand-kicker">Institución pública de excelencia</span>
    </a>
    <nav class="main-nav">
      <ul>
        {{ range .Site.Menus.main }}
          {{ if not .Parent }}
          <li class="nav-item{{ if .HasChildren }} has-children{{ end }}">
            <a href="{{ .URL }}"{{ if .HasChildren }} aria-haspopup="true" aria-expanded="false"{{ end }}>{{ .Name }}</a>
            {{ if .HasChildren }}
            <ul class="submenu">
              {{ range .Children }}
              <li><a href="{{ .URL }}">{{ .Name }}</a></li>
              {{ end }}
            </ul>
            {{ end }}
          </li>
          {{ end }}
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
