name: Publicar sitio Hugo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir sitio
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Generar buscador
        run: npx -y pagefind --site public

      - name: Activar popup por defecto
        run: |
          mkdir -p public/js
          printf 'window.POPUP_COMUNICADOS_ENABLED = true;\n' > public/js/popup-config.js

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
